name: Build Blue Share Zone APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Generate Android project files
    run: |
      flutter create /tmp/blue_share_zone --project-name blue_share_zone --org com.bluesharezone --platforms=android
      cp -a /tmp/blue_share_zone/android ./android

  - name: Install dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: blue-share-zone-apk
      path: build/app/outputs/flutter-apk/app-release.apk
```
